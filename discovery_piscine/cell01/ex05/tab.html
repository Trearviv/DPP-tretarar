<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tab</title>
    <style>
        table{
            border-collapse: collapse;
            width: 100%;
        }
        td{
            width: 50%;
            height: 500px;
            text-align: center;
            vertical-align: middle;
            font-size: 24px;
            font-weight: bold;
            border: 1px solid black;
        }
        .cell1{
            background-color: lightgreen;
        }
        .cell2{
            background-color: lightpink;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class = "cell1">First cell</td>
            <td class = "cell2">Second cell</td>
        </tr>
    </table>
</body>
</html>
